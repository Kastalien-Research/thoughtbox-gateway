[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[project]
name = "thoughtbox-gateway"
version = "0.1.0"
description = "Code-mode-first MCP gateway for the Dedalus Marketplace"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kastalien Research", email = "founders@kastalien.com" },
]
keywords = ["ai", "mcp", "agents", "dedalus", "gateway"]

dependencies = [
    "dedalus-mcp>=0.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.1",
    "uvloop>=0.22.1; platform_system != 'Windows'",
]

[project.urls]
Homepage = "https://github.com/Kastalien-Research/thoughtbox-gateway"
Repository = "https://github.com/Kastalien-Research/thoughtbox-gateway"

[tool.uv]
preview = true
package = false
default-groups = ["runtime"]
cache-dir = ".cache/uv"
compile-bytecode = true
link-mode = "hardlink"
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
resolution = "highest"
prerelease = "if-necessary"
python-preference = "managed"
python-downloads = "automatic"
